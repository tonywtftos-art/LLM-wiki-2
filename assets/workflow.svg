<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3d4a44"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b5432f"/></marker>
    <style>
      .n{fill:#fff;stroke:#3d4a44;stroke-width:1.5}
      .h{fill:#fdf1d8;stroke:#a77a12;stroke-width:1.5}
      .c{fill:#e4efe9;stroke:#1f5e4a;stroke-width:2}
      .t{fill:#1d2421;text-anchor:middle}
      .s{fill:#55605b;font-size:12.5px;text-anchor:middle}
      .e{stroke:#3d4a44;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .b{stroke:#b5432f;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}
      .bl{fill:#b5432f;font-size:12.5px;font-weight:700}
      .g{fill:#1f5e4a;font-size:12.5px;font-weight:700}
      .ti{font-size:19px;font-weight:700;fill:#1f5e4a}
      .frame{fill:#f7f6f1;stroke:#d8d5c8;stroke-width:1.2}
    </style>
  </defs>
  <rect width="960" height="1080" fill="#ffffff"/>

  <!-- Loop A -->
  <rect class="frame" x="20" y="20" width="920" height="470" rx="14"/>
  <text x="44" y="54" class="ti">迴圈 A：Ingest（每篇文獻跑一次）</text>

  <rect class="h" x="44" y="80" width="170" height="56" rx="10"/><text class="t" x="129" y="106">使用者放入 PDF</text><text class="s" x="129" y="125">raw/papers/</text>
  <rect class="n" x="270" y="80" width="170" height="56" rx="10"/><text class="t" x="355" y="106">① 讀原文</text><text class="s" x="355" y="125">記下頁碼對照</text>
  <rect class="n" x="496" y="80" width="170" height="56" rx="10"/><text class="t" x="581" y="106">② 寫文獻頁</text><text class="s" x="581" y="125">固定 9 段格式</text>
  <rect class="n" x="722" y="80" width="190" height="56" rx="10"/><text class="t" x="817" y="106">③ 更新概念頁</text><text class="s" x="817" y="125">衝突寫進「矛盾」</text>

  <path class="e" d="M214,108H266"/><path class="e" d="M440,108H492"/><path class="e" d="M666,108H718"/>

  <polygon class="c" points="817,180 917,240 817,300 717,240"/>
  <text class="t" x="817" y="236" font-weight="700">檢查①</text><text class="s" x="817" y="256">引文·數字對照原文</text>
  <path class="e" d="M817,136V176"/>
  <path class="b" d="M717,240H600V140"/><text class="bl" x="612" y="230">FAIL：退回重寫</text>

  <rect class="n" x="722" y="340" width="190" height="56" rx="10"/><text class="t" x="817" y="366">④ 更新 index、log</text><text class="s" x="817" y="385">網站選單同步</text>
  <path class="e" d="M817,300V336"/><text class="g" x="826" y="324">PASS</text>

  <polygon class="n" points="520,330 600,368 520,406 440,368"/>
  <text class="t" x="520" y="373">還有下一篇？</text>
  <path class="e" d="M722,368H604"/>
  <path class="e" d="M440,368H300V140"/><text class="g" x="312" y="358">是：下一篇</text>

  <rect class="h" x="44" y="400" width="200" height="60" rx="10"/><text class="t" x="144" y="426">⑤ 使用者事後審閱</text><text class="s" x="144" y="446">人也是 graph 的一個節點</text>
  <path class="e" d="M520,406V430H248"/><text class="g" x="380" y="424">否</text>
  <path class="b" d="M144,400V170H560V140"/><text class="bl" x="152" y="162">要改 → 回②</text>

  <!-- Loop B -->
  <rect class="frame" x="20" y="510" width="920" height="550" rx="14"/>
  <text x="44" y="544" class="ti">迴圈 B：產生教學簡報（wiki 完成後）</text>

  <rect class="n" x="44" y="580" width="190" height="60" rx="10"/><text class="t" x="139" y="606">⑥ Query wiki</text><text class="s" x="139" y="625">規劃大綱，存回 syntheses/</text>
  <polygon class="c" points="380,570 470,610 380,650 290,610"/><text class="t" x="380" y="606" font-weight="700">檢查②</text><text class="s" x="380" y="626">大綱都有出處</text>
  <rect class="n" x="526" y="580" width="170" height="60" rx="10"/><text class="t" x="611" y="606">⑦ 寫 HTML 簡報</text><text class="s" x="611" y="625">每頁標 data-src</text>
  <path class="e" d="M234,610H286"/><path class="e" d="M470,610H522"/>
  <path class="b" d="M380,650V668H139V644"/><text class="bl" x="160" y="686">缺出處 → 回⑥</text>

  <polygon class="c" points="817,540 912,610 817,680 722,610"/>
  <text class="t" x="817" y="598" font-weight="700">檢查②③④⑤</text><text class="s" x="817" y="618">追溯·白話·矛盾·架構</text><text class="s" x="817" y="636">check_slides.py</text>
  <path class="e" d="M696,610H718"/>
  <path class="b" d="M770,648V700H611V644"/><text class="bl" x="626" y="722">FAIL：改那一頁（最多 3 輪）</text>

  <rect class="h" x="44" y="710" width="210" height="56" rx="10"/><text class="t" x="149" y="735">3 輪仍失敗 → 問使用者</text><text class="s" x="149" y="754">避免無限迴圈</text>
  <path class="b" d="M611,700V738H258"/>

  <rect class="n" x="722" y="780" width="190" height="60" rx="10"/><text class="t" x="817" y="806">⑧ 截圖看版面</text><text class="s" x="817" y="825">電腦＋手機</text>
  <path class="e" d="M817,680V776"/><text class="g" x="826" y="740">PASS</text>
  <rect class="n" x="470" y="780" width="190" height="60" rx="10"/><text class="t" x="565" y="806">⑨ 檢查報告</text><text class="s" x="565" y="825">checks/、log</text>
  <path class="e" d="M722,810H664"/>
  <rect class="h" x="200" y="780" width="200" height="60" rx="10"/><text class="t" x="300" y="806">⑩ 使用者看簡報</text><text class="s" x="300" y="825">字句→回⑦　架構→回⑥</text>
  <path class="e" d="M470,810H404"/>

  <rect x="44" y="862" width="868" height="58" rx="10" fill="#e8e1f3" stroke="#6b4fa0" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text class="t" x="478" y="886" font-weight="700">⓪ 檢查程式自我測試 tools/selftest.py（第一次執行後新增）</text>
  <text class="s" x="478" y="906">故意放 12 種錯，確認檢查①～⑤都抓得到；tools/ 改過就先跑，全部 CAUGHT 才信任檢查結果</text>

  <!-- legend -->
  <rect x="44" y="950" width="880" height="86" rx="10" fill="#fff" stroke="#d8d5c8"/>
  <rect class="n" x="64" y="970" width="34" height="20" rx="5"/><text x="108" y="985" fill="#1d2421" font-size="13">AI 執行的節點</text>
  <rect class="h" x="250" y="970" width="34" height="20" rx="5"/><text x="294" y="985" fill="#1d2421" font-size="13">人的節點</text>
  <polygon class="c" points="440,968 458,980 440,992 422,980"/><text x="468" y="985" fill="#1d2421" font-size="13">檢查節點（程式自動跑）</text>
  <path class="b" d="M650,980H700"/><text x="710" y="985" fill="#1d2421" font-size="13">退回邊＝loop</text>
  <text x="64" y="1020" fill="#55605b" font-size="13">整張圖是一個 graph；紅色虛線讓流程往回走，形成 loop。檢查①放在 ingest 階段，錯誤在進入簡報前就被攔下。</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
